<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Vinicius">
    <meta name="description" content="formulario em HTML">
    <title>Criando Formularios em HTML</title>
    <link rel="stylesheet" href="formulariodois.css">
</head>
    <body>

        <div class="conteiner">

        

                <h1>Formulario de Cadastro do Aluno</h1>
                <h2>Escola Senai/AC</h2>
            <form>
                <label for="name">Nome completo</label>
                <input type="text" id="name"><br><br>

                <label for="email">E-mail</label>
                <input type="email" id="email"><br><br>
            
                <label for="tel">Telefone</label>
                <input type="tel" id="tel"><br><br>
            
                <label for="name">Sexo Masculino</label>
                <input type="radio" id="name"><br><br>

                <label for="name">Sexo Feminino</label>
                <input type="radio" id="name"><br><br>

                <label for="CPF">Digite seu CPF</label>
                <input type="tel" id="tel"><br><br>

                <label for="curso">Curso</label>
                <select name="curso" id="curso"><br><br>
                <option value="Full Stack">Programador Full Stack</option>
                <option value="Mecanico">Mecânico de Automoveis</option>
                <option value="Eletricista">Eletricista Predial</option>
                </select><br><br>
            
                <label for="date">Data de Nascimento</label>
                <input type="date" id="date"><br><br>

                <label for="password">Senha</label>
                <input type="password" id="password"><br><br>
            
                <input type="submit" id="btn-enviar" name="btn-enviar" required>
                
            </form>
        </div>
        <img src="goat.png" width="40%">
    
    </body>
</html>
